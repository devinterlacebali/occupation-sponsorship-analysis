<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Occupation Match Report — Idham Aulia Salim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1611;
    --ink-soft: #4a4338;
    --ink-muted: #7a7063;
    --paper: #faf7f0;
    --paper-2: #f3ede0;
    --line: #d9cfb9;
    --accent: #b8431f;
    --accent-deep: #8a2f14;
    --gold: #c89b3c;
    --green: #3d7349;
    --amber: #c27a1b;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Inter Tight', sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  body {
    background:
      radial-gradient(circle at 10% 0%, rgba(184,67,31,0.06), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(200,155,60,0.08), transparent 40%),
      var(--paper);
    min-height:100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 28px 80px; }

  .hero { border-bottom: 1px solid var(--line); padding-bottom: 40px; margin-bottom: 48px; position:relative; }
  .hero::before {
    content:''; position:absolute; top:0; right:0; width:180px; height:180px;
    background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(184,67,31,0.08) 8px, rgba(184,67,31,0.08) 9px);
    pointer-events:none;
  }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 18px; }
  .eyebrow::before { content:'§ '; color: var(--ink-muted); }
  h1 { font-family:'Fraunces', serif; font-weight:600; font-size: clamp(36px, 5.5vw, 64px); line-height: 1.02; letter-spacing: -0.02em; margin-bottom: 14px; }
  h1 em { font-style: italic; color: var(--accent-deep); font-weight:400; }
  .hero-sub { font-size: 17px; color: var(--ink-soft); max-width: 760px; }
  .hero-meta { display:flex; flex-wrap:wrap; gap: 28px; margin-top: 28px; font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--ink-muted); }
  .hero-meta span { display:flex; align-items:center; gap:8px; }
  .hero-meta b { color: var(--ink); font-weight:500; }

  section { margin-bottom: 56px; }
  .sec-head { display:flex; align-items:baseline; gap: 16px; margin-bottom: 20px; padding-bottom:12px; border-bottom: 1px dashed var(--line); }
  .sec-num { font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--accent); }
  h2 { font-family:'Fraunces',serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  h2 em { font-style: italic; color: var(--accent-deep); }
  .sec-desc { color: var(--ink-soft); max-width: 820px; margin-bottom: 24px; font-size:15px; }

  .profile { display:grid; grid-template-columns: 1.4fr 1fr; gap: 32px; background: var(--paper-2); padding: 32px; border-radius: 4px; border: 1px solid var(--line); position:relative; }
  .profile::before { content:''; position:absolute; top:12px; left:12px; right:12px; bottom:12px; border:1px solid rgba(184,67,31,0.15); pointer-events:none; border-radius:2px; }
  .profile h3 { font-family:'Fraunces',serif; font-weight:600; font-size: 22px; margin-bottom: 10px; }
  .profile p { color: var(--ink-soft); margin-bottom: 14px; font-size:14.5px; }
  .profile-name { font-family:'Fraunces',serif; font-size: 28px; font-weight:600; margin-bottom:4px; }
  .profile-role { font-family:'JetBrains Mono',monospace; color: var(--accent); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:16px; }
  .skill-cloud { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-block; padding: 4px 10px; background: var(--paper); border:1px solid var(--line); border-radius: 999px; font-size:12px; font-family:'JetBrains Mono',monospace; color: var(--ink-soft); }
  .chip-hi { background: var(--accent); color: white; border-color: var(--accent); }

  .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom: 32px; }
  .stat { background: white; border:1px solid var(--line); padding: 22px 20px; border-radius:4px; position:relative; overflow:hidden; }
  .stat::after { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background: var(--accent); }
  .stat-label { font-family:'JetBrains Mono',monospace; font-size: 10.5px; letter-spacing:0.12em; text-transform:uppercase; color: var(--ink-muted); margin-bottom:8px; }
  .stat-val { font-family:'Fraunces',serif; font-size:34px; font-weight:600; color: var(--ink); line-height:1; }
  .stat-sub { font-size:12px; color: var(--ink-muted); margin-top:6px; }

  .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 24px; align-items:center; padding: 14px 16px; background: white; border:1px solid var(--line); border-radius: 4px; }
  .filter-label { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-muted); margin-right:6px; }
  .pill { padding:6px 14px; border:1px solid var(--line); background: var(--paper); border-radius: 999px; cursor:pointer; font-size:13px; font-family:'JetBrains Mono',monospace; transition: all 0.15s; user-select:none; }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .cards { display:grid; grid-template-columns: 1fr; gap:18px; }
  .card { background: white; border:1px solid var(--line); border-radius:4px; padding: 24px 26px; transition: all 0.2s; position:relative; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 12px 28px -18px rgba(26,22,17,0.25); }
  .card[data-rank="1"], .card[data-rank="2"], .card[data-rank="3"] { border-left: 4px solid var(--gold); }
  .card-head { display:grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items:flex-start; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px dashed var(--line); }
  .rank-badge { font-family:'Fraunces',serif; font-size: 28px; font-weight:600; color: var(--accent); min-width: 48px; line-height:1; padding-top:4px; }
  .card[data-rank="1"] .rank-badge, .card[data-rank="2"] .rank-badge, .card[data-rank="3"] .rank-badge { color: var(--gold); }
  .card-title { font-family:'Fraunces',serif; font-size: 21px; font-weight:600; line-height:1.25; margin-bottom:6px; color: var(--ink); }
  .card-meta { font-size: 13px; color: var(--ink-muted); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .company { color: var(--ink-soft); font-weight:500; }
  .state-tag { background: var(--paper-2); padding: 2px 8px; border-radius: 3px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; color: var(--ink); }
  .dot { color: var(--line); }
  .score-block { text-align: right; }
  .score-big { font-family:'Fraunces',serif; font-size: 36px; font-weight:600; line-height:1; color: var(--ink); }
  .score-label { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-muted); }

  .metrics-row { display:grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 18px; }
  .metric { display:grid; grid-template-columns: 100px 1fr 40px; gap: 10px; align-items:center; }
  .metric-label { font-family:'JetBrains Mono',monospace; font-size: 10.5px; color: var(--ink-muted); text-transform:uppercase; letter-spacing:0.08em; }
  .bar { height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height:100%; border-radius: 999px; transition: width 0.8s ease; }
  .bar-fill.skill { background: linear-gradient(90deg, var(--accent) 0%, var(--accent-deep) 100%); }
  .bar-fill.sponsor { background: linear-gradient(90deg, var(--gold) 0%, var(--amber) 100%); }
  .metric-val { font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--ink); text-align:right; font-weight:500; }

  .info-grid { display:grid; grid-template-columns: repeat(3,1fr); gap: 18px; padding: 16px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); margin-bottom:18px; }
  .info-k { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom: 4px; }
  .info-v { font-size: 13.5px; color: var(--ink); font-weight:500; }
  .anzsco-val { font-family:'JetBrains Mono',monospace; }
  .anzsco-name { font-family:'Inter Tight',sans-serif; color:var(--ink-soft); font-weight:400; font-size:12.5px; }

  .sp-badge { display:inline-block; padding:3px 10px; border-radius: 999px; font-size:11px; font-family:'JetBrains Mono',monospace; font-weight:500; letter-spacing:0.04em; }
  .sp-vstrong { background: var(--green); color: white; }
  .sp-strong { background: #4d8557; color: white; }
  .sp-mod { background: var(--amber); color: white; }
  .sp-ment { background: var(--paper-2); color: var(--ink); border:1px solid var(--line); }
  .sp-weak { background: var(--paper-2); color: var(--ink-muted); border:1px solid var(--line); }

  .skills-block { margin-bottom: 20px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .muted { color: var(--ink-muted); font-size:13px; font-style:italic; }

  .actions { display:flex; flex-wrap:wrap; gap:10px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding: 9px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:0.04em; text-decoration:none; border-radius:3px; transition:all 0.15s; cursor:pointer; border:1px solid transparent; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding:5px 10px; font-size:11px; }

  .deep-wrap { display:grid; grid-template-columns: 1fr; gap: 24px; }
  .deep-card { background: linear-gradient(180deg, white 0%, var(--paper-2) 100%); border:1px solid var(--line); border-radius: 4px; overflow:hidden; position:relative; }
  .deep-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background: linear-gradient(180deg, var(--gold), var(--accent)); }
  .deep-header { padding: 24px 30px 16px 34px; border-bottom:1px dashed var(--line); }
  .deep-rank { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); letter-spacing:0.15em; text-transform:uppercase; margin-bottom: 6px; }
  .deep-header h3 { font-family:'Fraunces',serif; font-size:24px; font-weight:600; color: var(--ink); margin-bottom:4px; }
  .deep-sub { font-size:13px; color: var(--ink-muted); font-family:'JetBrains Mono',monospace; }
  .deep-body { padding: 22px 30px 26px 34px; }
  .deep-body p { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .deep-body strong { color: var(--ink); }
  .deep-body em { color: var(--accent-deep); font-style:italic; }
  .deep-body a { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(184,67,31,0.3); text-underline-offset: 3px; }
  .deep-cta { display:flex; flex-wrap:wrap; gap: 10px; margin-top: 20px; padding-top:18px; border-top: 1px dashed var(--line); }

  .anzsco-table { width:100%; background: white; border:1px solid var(--line); border-collapse:separate; border-spacing:0; border-radius: 4px; overflow:hidden; }
  .anzsco-table th, .anzsco-table td { text-align:left; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size:14px; }
  .anzsco-table th { background: var(--paper-2); font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-muted); }
  .anzsco-table tbody tr:last-child td { border-bottom: 0; }
  .anzsco-table tbody tr:hover { background: var(--paper); }
  .mono { font-family:'JetBrains Mono',monospace; font-weight:500; }
  .num { text-align:center; font-family:'JetBrains Mono',monospace; }

  .visa-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:18px; }
  .visa-card { background: white; border:1px solid var(--line); padding: 22px; border-radius: 4px; }
  .visa-code { font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--accent); letter-spacing:0.08em; text-transform:uppercase; margin-bottom: 8px; }
  .visa-name { font-family:'Fraunces',serif; font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .visa-desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; line-height:1.5; }
  .visa-list { list-style:none; padding:0; }
  .visa-list li { font-size:12.5px; color:var(--ink-soft); padding: 3px 0 3px 14px; position:relative; }
  .visa-list li::before { content:'▸'; position:absolute; left:0; color: var(--accent); font-size:10px; top:5px; }

  footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); font-size:12px; color: var(--ink-muted); font-family:'JetBrains Mono',monospace; text-align:center; line-height:1.8; }

  @media (max-width: 800px) {
    .stats { grid-template-columns: repeat(2,1fr); }
    .profile { grid-template-columns: 1fr; }
    .card-head { grid-template-columns: auto 1fr; }
    .score-block { grid-column: 1 / -1; text-align: left; display:flex; align-items:baseline; gap:8px; }
    .metrics-row, .info-grid, .visa-grid { grid-template-columns: 1fr; }
  }

  #lockscreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0c; display: flex; align-items: center; justify-content: center;
    z-index: 9999; color: white; transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #lockscreen.hidden { opacity: 0; pointer-events: none; visibility: hidden; transform: scale(1.1); }
  .lock-card {
    background: rgba(255,255,255,0.03); padding: 48px; border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(40px);
    text-align: center; max-width: 400px; width: 90%;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  .lock-card h2 { font-family: 'Fraunces', serif; margin-bottom: 12px; font-size: 28px; font-weight: 500; }
  .lock-card p { color: #888; margin-bottom: 32px; font-size: 14px; }
  .lock-card input {
    width: 100%; padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: white; margin-bottom: 20px; text-align: center;
    font-size: 18px; outline: none; transition: all 0.3s;
  }
  .lock-card input:focus { border-color: #b8431f; background: rgba(0,0,0,0.4); }
  .lock-card button {
    background: #b8431f; color: white; border: none; padding: 16px;
    border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px;
    transition: all 0.3s; transform: translateZ(0);
  }
  .lock-card button:hover { background: #d94e24; transform: translateY(-1px); }
  .lock-error { color: #ff6b6b; font-size: 13px; margin-top: 16px; display: none; font-family: sans-serif; }
  body.locked { overflow: hidden; }
  body.unlocked #content-mount { opacity: 1; filter: blur(0); }
  #content-mount { opacity: 0; filter: blur(10px); transition: all 1s ease; }
</style>
</head>

    </div>
  </div>

    async function checkPass() {
      const pass = document.getElementById('passInput').value;
      const error = document.getElementById('lockError');
      const mount = document.getElementById('content-mount');
      const screen = document.getElementById('lockscreen');

      try {
        // Deterministic Key/IV derivation (Same as Node)
        const key = CryptoJS.SHA256(pass);
        const iv = CryptoJS.enc.Hex.parse(key.toString().substring(0, 32));
        
        const decrypted = CryptoJS.AES.decrypt(encryptedData, key, {
            iv: iv,
            mode: CryptoJS.mode.CBC,
            padding: CryptoJS.pad.Pkcs7
        }).toString(CryptoJS.enc.Utf8);
        
        if (decrypted && decrypted.length > 100) {
            mount.innerHTML = decrypted;
            screen.classList.add('hidden');
            document.body.classList.remove('locked');
            document.body.classList.add('unlocked');
            // Re-run the filter scripts
            setTimeout(initFilters, 100);
        } else {
            throw new Error();
        }
      } catch (e) {
          error.style.display = 'block';
          document.getElementById('passInput').value = '';
          document.getElementById('passInput').focus();
      }
    }

    document.getElementById('unlockBtn').onclick = checkPass;
    document.getElementById('passInput').onkeypress = (e) => { if(e.key==='Enter') checkPass(); };

    function initFilters() {
      const pills = document.querySelectorAll('.pill');
      const cards = document.querySelectorAll('#cards .card');
      const filters = { state: 'all', sponsor: 'all' };
      pills.forEach(p => p.addEventListener('click', () => {
        const f = p.dataset.filter, v = p.dataset.value;
        document.querySelectorAll('.pill[data-filter="'+f+'"]').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        filters[f] = v;
        cards.forEach(c => {
          const stateOk = filters.state === 'all' || c.dataset.state === filters.state;
          const sponsorOk = filters.sponsor === 'all' || c.dataset.sponsor === filters.sponsor;
          c.style.display = (stateOk && sponsorOk) ? '' : 'none';
        });
      }));
    }
  </script>
